name: Backend Release

# Publishes the runtime image to the GitHub Container Registry.
#
# Triggered by a version tag, so a release is an explicit act rather than a
# side effect of merging. `workflow_dispatch` covers re-publishing a build
# without moving the tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.4.0)'
        required: true
        type: string

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/vital-ai-api
  NODE_VERSION: '22'

jobs:
  # The published artefact is verified before it is published, not after. An
  # image that failed its own tests must never be taggable as a release.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

  publish:
    name: Build & publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify]
    permissions:
      contents: read
      # Required to push to GHCR under the repository's own namespace.
      packages: write
      # Lets the build attach a signed provenance attestation, so a deployed
      # digest can be traced back to the workflow run and commit that produced it.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          # arm64 alongside amd64: Graviton and Ampere instances are materially
          # cheaper for a workload of this shape, and building both now avoids a
          # rebuild the day someone moves the deployment onto them.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── deployment ─────────────────────────────────────────────────────────────
  # Migrations run as a release step against the production database, before any
  # new container serves traffic. They are deliberately *not* run at application
  # start-up: several instances boot at once during a rolling deploy, and each
  # one racing to migrate the same database is how a schema gets corrupted.
  #
  # Gated on a GitHub Environment, so the protection rules and secrets for
  # production live with the environment rather than in this file.
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish]
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: 'true'

      # The last line of defence before traffic arrives: if a migration in this
      # release introduced a table without Row Level Security, the deploy stops
      # here rather than exposing one user's health data to another.
      - name: Audit Row Level Security
        run: npm run db:verify-rls
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: 'true'

      - name: Summarise the release
        run: |
          {
            echo "### Backend release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Digest | \`${{ needs.publish.outputs.digest }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Migrations applied and RLS audit passed."
          } >> "$GITHUB_STEP_SUMMARY"
